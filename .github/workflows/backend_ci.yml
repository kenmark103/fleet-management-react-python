name: Backend CI

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test-backend:
    runs-on: ubuntu-latest
    environment: develop

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qwerty
          POSTGRES_DB: fleet_management_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # ── Secrets from GitHub environment "develop" ──────────────────────────
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Test DB — hardcoded to match the service above, no secret needed ───
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:qwerty@localhost:5432/fleet_management_test_db

      # ── Non-secret config — safe to set directly here ──────────────────────
      ALGORITHM: HS256
      ENVIRONMENT: testing
      ACCESS_TOKEN_EXPIRY_IN_MINUTES: 30
      REFRESH_TOKEN_EXPIRY_IN_DAYS: 7
      PASSWORD_RESET_TOKEN_EXPIRY_IN_DAYS: 1
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      ACCESS_TOKEN_MAX_AGE_SECONDS: 1800
      REFRESH_TOKEN_MAX_AGE_SECONDS: 604800

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest --tb=short -q

  docker:
    # Only build and push on push events (not PRs) and only if tests pass
    needs: test-backend
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fleet_m_backend:latest