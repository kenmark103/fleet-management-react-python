[pytest]
asyncio_mode = auto
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

pythonpath = .
addopts = --tb=short -q

markers =
    integration: marks tests as integration tests (require DB)
    e2e:         marks tests as end-to-end tests
    smoke:       marks tests as smoke tests (fast subset for CI gate)